<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewall Blocker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo-container {
            display: inline-block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .logo-container svg {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 10px 30px rgba(0, 150, 255, 0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 3.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #a0a0a0;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 150, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 150, 255, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 150, 255, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 150, 255, 0.2);
        }

        .card-icon {
            font-size: 1.8em;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 150, 255, 0.1);
            border-radius: 8px;
        }

        .card-header h2 {
            font-size: 1.3em;
            font-weight: 600;
            color: #00d4ff;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"], select {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-radius: 8px;
            font-size: 14px;
            color: #e0e0e0;
            font-family: inherit;
            transition: all 0.3s;
        }

        input[type="text"]::placeholder {
            color: #606060;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #0f3460;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 150, 255, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00d96f 0%, #00a854 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 217, 111, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff3366 0%, #cc0044 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4);
        }

        .result {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            border-left: 4px solid;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result.allowed {
            background: rgba(0, 217, 111, 0.1);
            color: #00d96f;
            border-left-color: #00d96f;
            border: 1px solid rgba(0, 217, 111, 0.3);
        }

        .result.blocked {
            background: rgba(255, 51, 102, 0.1);
            color: #ff3366;
            border-left-color: #ff3366;
            border: 1px solid rgba(255, 51, 102, 0.3);
        }

        .lists-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .list-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 150, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .list-card h3 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .list-card-icon {
            width: 30px;
            height: 30px;
            background: rgba(0, 150, 255, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
        }

        .list-container {
            max-height: 350px;
            overflow-y: auto;
        }

        .list-container::-webkit-scrollbar {
            width: 6px;
        }

        .list-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .list-container::-webkit-scrollbar-thumb {
            background: rgba(0, 150, 255, 0.3);
            border-radius: 10px;
        }

        .list-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 150, 255, 0.5);
        }

        .list-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(0, 150, 255, 0.1);
            transition: all 0.2s;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 150, 255, 0.3);
        }

        .list-item.blocked {
            border-left: 3px solid #ff3366;
        }

        .list-item.allowed {
            border-left: 3px solid #00d96f;
        }

        .list-item-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .list-item-text strong {
            color: #e0e0e0;
            word-break: break-all;
        }

        .list-item-text small {
            color: #808080;
            font-size: 12px;
        }

        .btn-remove {
            background: rgba(255, 51, 102, 0.2);
            color: #ff3366;
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid rgba(255, 51, 102, 0.3);
        }

        .btn-remove:hover {
            background: rgba(255, 51, 102, 0.4);
            border-color: #ff3366;
        }

        .empty-message {
            text-align: center;
            color: #606060;
            padding: 40px 20px;
            font-style: italic;
            font-size: 14px;
        }

        .empty-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .type-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .lists-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5em;
            }

            .logo-container svg {
                width: 80px;
                height: 80px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 0;
            }

            .header {
                margin-bottom: 30px;
            }

            .main-content {
                gap: 15px;
            }

            .card, .list-card {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .input-group {
                flex-direction: column;
            }

            input[type="text"], button, select {
                width: 100%;
            }

            .list-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .btn-remove {
                width: 100%;
                justify-content: center;
            }
        }

        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 150, 255, 0.2);
            color: #00d4ff;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Shield background -->
                    <defs>
                        <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M100 20 L160 50 L160 110 C160 150 100 180 100 180 C100 180 40 150 40 110 L40 50 Z" 
                          fill="url(#shieldGradient)" opacity="0.2" stroke="url(#shieldGradient)" stroke-width="2"/>
                    
                    <!-- Shield outline -->
                    <path d="M100 20 L160 50 L160 110 C160 150 100 180 100 180 C100 180 40 150 40 110 L40 50 Z" 
                          fill="none" stroke="url(#shieldGradient)" stroke-width="3" stroke-linejoin="round"/>
                    
                    <!-- Block symbol -->
                    <circle cx="100" cy="100" r="35" fill="none" stroke="url(#shieldGradient)" stroke-width="3"/>
                    <line x1="75" y1="75" x2="125" y2="125" stroke="url(#shieldGradient)" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>Firewall Blocker</h1>
            <p class="subtitle">Secure Network Protection at Your Fingertips</p>
        </div>

        <div class="main-content">
            <!-- Check Access Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-search"></i>
                    </div>
                    <h2>Check Access</h2>
                </div>
                <div class="input-group">
                    <input type="text" id="checkInput" placeholder="google.com or 192.168.1.1">
                    <button class="btn-primary" onclick="checkAccess()">
                        <i class="fas fa-check"></i> Check
                    </button>
                </div>
                <div id="checkResult" class="result"></div>
            </div>

            <!-- Block Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-ban"></i>
                    </div>
                    <h2>Block Access</h2>
                </div>
                <div class="input-group">
                    <div class="type-selector">
                        <select id="blockType">
                            <option value="url">URL</option>
                            <option value="domain">Domain</option>
                            <option value="ip">IP</option>
                        </select>
                    </div>
                    <input type="text" id="blockInput" placeholder="Enter to block...">
                    <button class="btn-danger" onclick="blockAccess()">
                        <i class="fas fa-lock"></i> Block
                    </button>
                </div>
            </div>

            <!-- Allow Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2>Allow Access</h2>
                </div>
                <div class="input-group">
                    <div class="type-selector">
                        <select id="allowType">
                            <option value="url">URL</option>
                            <option value="domain">Domain</option>
                            <option value="ip">IP</option>
                        </select>
                    </div>
                    <input type="text" id="allowInput" placeholder="Enter to allow...">
                    <button class="btn-success" onclick="allowAccess()">
                        <i class="fas fa-unlock"></i> Allow
                    </button>
                </div>
            </div>

            <!-- Status Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h2>Firewall Status</h2>
                </div>
                <div style="padding: 20px 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(0, 150, 255, 0.2);">
                        <span>Blocked Items</span>
                        <strong id="blockedCount" style="color: #ff3366;">0</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>Allowed Items</span>
                        <strong id="allowedCount" style="color: #00d96f;">0</strong>
                    </div>
                </div>
            </div>
        </div>

        <div class="lists-container">
            <!-- Blocked List -->
            <div class="list-card">
                <h3>
                    <div class="list-card-icon">
                        <i class="fas fa-ban"></i>
                    </div>
                    Blocked Items
                </h3>
                <div class="list-container" id="blockedListContainer">
                    <div class="empty-message">
                        <div class="empty-icon">🛡️</div>
                        No blocked items
                    </div>
                </div>
            </div>

            <!-- Allowed List -->
            <div class="list-card">
                <h3>
                    <div class="list-card-icon">
                        <i class="fas fa-check"></i>
                    </div>
                    Allowed Items
                </h3>
                <div class="list-container" id="allowedListContainer">
                    <div class="empty-message">
                        <div class="empty-icon">✓</div>
                        No allowed items
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function checkAccess() {
            const input = document.getElementById('checkInput').value.trim();
            const resultDiv = document.getElementById('checkResult');

            if (!input) {
                resultDiv.textContent = 'Please enter a URL, domain, or IP address';
                resultDiv.className = 'result blocked';
                return;
            }

            try {
                const response = await fetch('/api/check-access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input })
                });

                const data = await response.json();
                resultDiv.className = `result ${data.allowed ? 'allowed' : 'blocked'}`;
                resultDiv.innerHTML = `<i class="fas fa-${data.allowed ? 'check-circle' : 'times-circle'}"></i> ${data.input} - ${data.status}`;
            } catch (error) {
                resultDiv.className = 'result blocked';
                resultDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> Error: ${error.message}`;
            }
        }

        async function blockAccess() {
            const input = document.getElementById('blockInput').value.trim();
            const type = document.getElementById('blockType').value;

            if (!input) {
                alert('Please enter a URL, domain, or IP address');
                return;
            }

            try {
                await fetch('/api/block', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input, type })
                });

                document.getElementById('blockInput').value = '';
                loadLists();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        async function allowAccess() {
            const input = document.getElementById('allowInput').value.trim();
            const type = document.getElementById('allowType').value;

            if (!input) {
                alert('Please enter a URL, domain, or IP address');
                return;
            }

            try {
                await fetch('/api/allow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input, type })
                });

                document.getElementById('allowInput').value = '';
                loadLists();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        async function removeBlocked(input, type) {
            try {
                await fetch('/api/unblock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input, type })
                });
                loadLists();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        async function loadLists() {
            try {
                const response = await fetch('/api/lists');
                const data = await response.json();

                const blockedContainer = document.getElementById('blockedListContainer');
                const blockedAll = [
                    ...data.blocked.urls.map(item => ({ item, type: 'url' })),
                    ...data.blocked.domains.map(item => ({ item, type: 'domain' })),
                    ...data.blocked.ips.map(item => ({ item, type: 'ip' }))
                ];

                if (blockedAll.length === 0) {
                    blockedContainer.innerHTML = '<div class="empty-message"><div class="empty-icon">🛡️</div>No blocked items</div>';
                } else {
                    blockedContainer.innerHTML = blockedAll.map(({ item, type }) => `
                        <div class="list-item blocked">
                            <div class="list-item-text">
                                <strong>${item}</strong>
                                <small><span class="type-badge">${type.toUpperCase()}</span></small>
                            </div>
                            <button class="btn-remove" onclick="removeBlocked('${item.replace(/'/g, "\\'")}', '${type}')">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                        </div>
                    `).join('');
                }

                const allowedContainer = document.getElementById('allowedListContainer');
                const allowedAll = [
                    ...data.allowed.urls.map(item => ({ item, type: 'url' })),
                    ...data.allowed.domains.map(item => ({ item, type: 'domain' })),
                    ...data.allowed.ips.map(item => ({ item, type: 'ip' }))
                ];

                if (allowedAll.length === 0) {
                    allowedContainer.innerHTML = '<div class="empty-message"><div class="empty-icon">✓</div>No allowed items</div>';
                } else {
                    allowedContainer.innerHTML = allowedAll.map(({ item, type }) => `
                        <div class="list-item allowed">
                            <div class="list-item-text">
                                <strong>${item}</strong>
                                <small><span class="type-badge">${type.toUpperCase()}</span></small>
                            </div>
                            <button class="btn-remove" onclick="removeBlocked('${item.replace(/'/g, "\\'")}', '${type}')">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                        </div>
                    `).join('');
                }

                document.getElementById('blockedCount').textContent = blockedAll.length;
                document.getElementById('allowedCount').textContent = allowedAll.length;
            } catch (error) {
                console.error('Error loading lists:', error);
            }
        }

        document.getElementById('checkInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAccess();
        });

        window.onload = () => loadLists();
    </script>
</body>
</html>
